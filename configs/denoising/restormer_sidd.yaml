model:
  name: restormer_denoising
degradation:
  profile: sidd_srgb_pairs_v1
dataset:
  kind: manifest
  root: .
  train_manifest: data/manifests/sidd_srgb/train.jsonl
  val_manifest: data/manifests/sidd_srgb/val.jsonl
  patch_size: 128
training:
  device: cuda
  precision: fp16
  batch_size: 1
  accumulation_steps: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_steps: 1000
  max_seconds: 1800
loss:
  kind: l1
